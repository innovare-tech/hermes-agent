# Produção na VPS Innovare (/opt/innovare/apps/hermes). Um container: gateway (todos os perfis,
# multiplexado) + painel, supervisionados pelo s6 — o "Reiniciar gateway" do painel reinicia o slot.
# Segredos dos perfis ficam em ./data/.env; o login do painel (Google) em ./dashboard.env, fora do volume.
services:
  hermes:
    image: ghcr.io/innovare-tech/hermes-agent:${TAG:?TAG vem do .env que o deploy grava}
    container_name: hermes
    restart: unless-stopped
    # host: o painel (127.0.0.1:9119) fica atrás do nginx da VPS; o MCP do Copiloto (127.0.0.1:3170)
    # e a API dos perfis (127.0.0.1:8642) não saem da máquina.
    network_mode: host
    command: ["gateway", "run"]
    env_file:
      - path: ./dashboard.env  # HERMES_DASHBOARD_OIDC_* e HERMES_DASHBOARD_PUBLIC_URL (não repetir em data/.env)
        required: true
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 127.0.0.1
      HERMES_DASHBOARD_PORT: "9119"
      TZ: America/Sao_Paulo
    volumes:
      - ./data:/opt/data
