name: Deploy VPS Innovare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hermes-producao
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/innovare-tech/hermes-agent
  APP_DIR: /opt/innovare/apps/hermes

jobs:
  build-push-deploy:
    if: github.repository == 'innovare-tech/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Copy compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/innovare/docker-compose.yml
          target: ${{ env.APP_DIR }}
          strip_components: 2
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd ${{ env.APP_DIR }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            TAG=${{ github.sha }} docker compose pull
            TAG=${{ github.sha }} docker compose up -d --remove-orphans
            docker image prune -f
            # Painel de pé (o s6 sobe o dashboard alguns segundos depois do gateway).
            for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:9119/ && exit 0; sleep 4; done
            docker logs --tail 80 hermes; exit 1
